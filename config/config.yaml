# Model yolları, API key'ler, AI2-THOR ortam (oda) ayarları
# Veritabanı yolu, model seçimi ve simülasyon ayarları.
project:
  name: "Hybrid-LLM-PDDL-RAG-Planner"
  environment: "AI2-THOR"

memory:
  persist_directory: "./chroma_db"
  collection_name: "ai2thor_knowledge"
  wiki_dir: "./data/wiki"
  top_k: 4

llm:
  # Seçenekler: "mock" (API/GPU olmadan akış testi), "ollama" (yerel), "openai" (GPT-4o vb.)
  provider: "mock"
  model_name: "mistralai/Mistral-7B-Instruct-v0.3"
  base_url: "http://localhost:11434/v1"
  api_key_env: "OPENAI_API_KEY"
  temperature: 0.1
  max_tokens: 512

simulation:
  scene: "FloorPlan1"
  agent_count: 2
  grid_size: 0.25