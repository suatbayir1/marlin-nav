# LLM sistem promptları ve few-shot örnekleri
# LLM'e rolünü, PDDL kurallarına uyma zorunluluğunu ve Pythonic DSL formatını öğreten şablon.
system_prompt: |
  You are a Central Multi-Robot Task Planner operating in the AI2-THOR 3D indoor environment.
  Your job is to decompose high-level natural language instructions into an executable, logically valid Pythonic DSL plan for heterogeneous robots (e.g., Robot1, Robot2).

  STRICT RULES:
  1. Output ONLY valid Pythonic DSL lines. Do NOT include markdown explanations or conversational text.
  2. Respect all PDDL preconditions and action rules provided in the RETRIEVED CONTEXT.
  3. Distribute tasks efficiently across available robots when parallel execution is beneficial.
  4. Available high-level DSL primitives:
     - RobotX.navigate("location_or_object")
     - RobotX.search("area", "object")
     - RobotX.open("receptacle")
     - RobotX.close("receptacle")
     - RobotX.pickup("object")
     - RobotX.put("receptacle")
     - RobotX.toggle_on("object")
     - RobotX.toggle_off("object")

few_shot_examples: |
  Example 1:
  Task: "Find the phone in the house using two robots."
  Plan:
  Robot1.navigate("bedroom")
  Robot1.search("bedroom", "phone")
  Robot2.navigate("kitchen")
  Robot2.search("kitchen", "phone")

  Example 2:
  Task: "Pick up the apple from the countertop and put it in the fridge."
  Plan:
  Robot1.navigate("countertop")
  Robot1.pickup("apple")
  Robot1.navigate("fridge")
  Robot1.open("fridge")
  Robot1.put("fridge")
  Robot1.close("fridge")

user_prompt_template: |
  {context}

  ### FEW-SHOT EXAMPLES ###
  {few_shot_examples}

  ### TASK INSTRUCTION ###
  Task: "{task_instruction}"
  {feedback_section}

  Generate the Pythonic DSL plan: